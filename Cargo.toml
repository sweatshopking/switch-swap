[package]
name = "switch-swap"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/sweatshopking/switch-swap"
description = "System-wide Xbox and Nintendo-style controller face-button remapping for Linux"

[[bin]]
name = "switch-swap"
path = "src/main.rs"

[dependencies]
evdev = "0.13.2"
gtk = { package = "gtk4", version = "0.11.5" }
libc = "0.2"
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
