name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev
      - name: Format, lint and test
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "${GITHUB_REF_NAME#v}" = "$expected" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $expected" >&2; exit 1; }

  # Every package is built on the oldest supported base (so it runs on everything
  # newer), natively on x86_64 and arm64, then installed and opened on fresh
  # systems before anything is released.
  deb-appimage:
    needs: test
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v7
      - run: packaging/build.sh deb-appimage
      - uses: actions/upload-artifact@v7
        with:
          name: packages-deb-appimage-${{ matrix.runner }}
          path: dist/*

  rpm:
    needs: test
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: registry.fedoraproject.org/fedora:41
    steps:
      - uses: actions/checkout@v7
      - run: packaging/build.sh rpm
      - uses: actions/upload-artifact@v7
        with:
          name: packages-rpm-${{ matrix.runner }}
          path: dist/*

  smoke-test:
    needs: [deb-appimage, rpm]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        target:
          - { kind: deb, image: "ubuntu:22.04" }
          - { kind: deb, image: "ubuntu:24.04" }
          - { kind: deb, image: "debian:12" }
          - { kind: rpm, image: "registry.fedoraproject.org/fedora:41" }
          - { kind: rpm, image: "registry.fedoraproject.org/fedora:43" }
          - { kind: rpm, image: "opensuse/tumbleweed" }
          - { kind: appimage, image: "ubuntu:22.04" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.target.image }}
    steps:
      - name: Tools the checkout needs
        run: |
          if command -v zypper >/dev/null; then zypper --non-interactive -q install tar gzip; fi
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - run: packaging/smoke-test.sh ${{ matrix.target.kind }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          **Which file do I need?** Most PCs are x86_64 (amd64). Raspberry Pi and other ARM computers use aarch64 (arm64).

          - Ubuntu, Linux Mint, Debian, Pop!_OS, Zorin: the \`.deb\`
          - Fedora, Nobara, openSUSE: the \`.rpm\`
          - Anything else (Arch, CachyOS, and others): the \`.AppImage\`, then open it and click **Install or update system service**

          See the [README](https://github.com/${GITHUB_REPOSITORY}#install) for step-by-step instructions.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Switch Swap $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
